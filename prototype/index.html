<title>용돈 나라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EAF0EE; --stage:#DCE6E2;
  --surface:#FFFFFF; --surface-2:#F4F7F5; --line:#E4EAE7;
  --ink:#1E2A2C; --muted:#6C7B7C; --faint:#9AA8A6;
  --mint:#0FA98C; --mint-ink:#0B7C66; --mint-soft:#D6F2EA;
  --coin:#F5B133; --coin-soft:#FCEDCF; --coin-ink:#9A6B08;
  --spend:#4C82F7; --spend-soft:#DEE9FE;
  --danger:#E5573F; --danger-soft:#FBE1DC;
  --good:#2FA86A;
  --shadow:0 6px 20px rgba(23,52,47,.10); --shadow-sm:0 2px 8px rgba(23,52,47,.07);
  --r:20px; --r-sm:13px;
  --disp:'Jua',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,sans-serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101917; --stage:#0B1210;
    --surface:#182421; --surface-2:#1E2B28; --line:#2A3A36;
    --ink:#E8F0ED; --muted:#9DB0AC; --faint:#70837F;
    --mint:#2BC4A4; --mint-ink:#7FE6D1; --mint-soft:#133A33;
    --coin:#F5B133; --coin-soft:#3A2E12; --coin-ink:#F3C970;
    --spend:#7AA4FF; --spend-soft:#1B2A45; --spend:#7AA4FF;
    --danger:#F27A66; --danger-soft:#3C201B;
    --good:#54C98A;
    --shadow:0 8px 26px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101917; --stage:#0B1210;
  --surface:#182421; --surface-2:#1E2B28; --line:#2A3A36;
  --ink:#E8F0ED; --muted:#9DB0AC; --faint:#70837F;
  --mint:#2BC4A4; --mint-ink:#7FE6D1; --mint-soft:#133A33;
  --coin:#F5B133; --coin-soft:#3A2E12; --coin-ink:#F3C970;
  --spend:#7AA4FF; --spend-soft:#1B2A45;
  --danger:#F27A66; --danger-soft:#3C201B;
  --good:#54C98A;
  --shadow:0 8px 26px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* stage + demo switcher */
.wrap{max-width:440px;margin:0 auto;padding:14px 12px 28px;min-height:100vh}
.demobar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:9px 11px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.demobar .tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);
  text-transform:uppercase;margin-right:2px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:11px;padding:3px;flex:1;min-width:210px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button.on.p{color:var(--mint-ink)}
.themebtn{width:34px;height:34px;border-radius:10px;background:var(--surface-2);font-size:15px;
  display:flex;align-items:center;justify-content:center}

/* phone */
.phone{background:var(--bg);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;
  border:1px solid var(--line)}
.screen{min-height:620px;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:10px;padding:16px 17px 10px}
.hd .who{display:flex;align-items:center;gap:9px}
.avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--mint-soft)}
.hd h1{font-family:var(--disp);font-size:19px;margin:0;font-weight:400;letter-spacing:.01em}
.hd .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.hd .sp{flex:1}
.bell{position:relative;width:38px;height:38px;border-radius:12px;background:var(--surface);
  box-shadow:var(--shadow-sm);font-size:17px;display:flex;align-items:center;justify-content:center}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;
  justify-content:center;font-family:var(--body)}
.actor-seg{display:flex;gap:3px;background:var(--surface-2);border-radius:11px;padding:3px}
.actor-seg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);transition:.12s}
.actor-seg button.on{background:var(--mint);color:#fff;box-shadow:var(--shadow-sm)}
.byline{color:var(--faint)}
.body{flex:1;overflow-y:auto;padding:4px 15px 16px}

/* nav */
.nav{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav button{flex:1;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--faint);position:relative}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--mint-ink)}
.nav .nd{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 3px;
  border-radius:8px;background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;
  justify-content:center;font-family:var(--body);font-weight:700}

/* cards + bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;
  box-shadow:var(--shadow-sm);margin-bottom:12px}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--muted);margin:16px 4px 8px;
  display:flex;align-items:center;gap:6px}
.sec-t .cnt{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:10px;
  padding:1px 7px;font-size:11px}

.balance{background:linear-gradient(135deg,var(--mint) 0%,var(--mint-ink) 100%);color:#fff;
  border:none;position:relative;overflow:hidden}
.balance .lab{font-size:12.5px;opacity:.9;font-weight:500}
.balance .amt{font-family:var(--disp);font-size:42px;line-height:1.05;margin:2px 0 3px;letter-spacing:.01em}
.balance .won{font-size:22px;opacity:.85}
.balance .pig{position:absolute;right:-6px;bottom:-14px;font-size:92px;opacity:.16}
.balance .row{display:flex;gap:8px;margin-top:12px}
.balance .chip{background:rgba(255,255,255,.18);border-radius:11px;padding:7px 10px;flex:1;backdrop-filter:blur(2px)}
.balance .chip .k{font-size:10.5px;opacity:.85}
.balance .chip .v{font-size:15px;font-weight:700;margin-top:1px}

.kidcard{display:flex;align-items:center;gap:12px;cursor:pointer}
.kidcard .av{width:46px;height:46px;border-radius:14px;font-size:24px;display:flex;align-items:center;
  justify-content:center;background:var(--mint-soft)}
.kidcard .nm{font-weight:700;font-size:15px}
.kidcard .rt{font-size:11.5px;color:var(--muted)}
.kidcard .bal{margin-left:auto;text-align:right}
.kidcard .bal b{font-family:var(--disp);font-size:22px;font-weight:400}
.kidcard .bal span{font-size:12px;color:var(--muted)}
.editkid{width:34px;height:34px;border-radius:10px;background:var(--surface-2);font-size:15px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;
  padding:12px 15px;font-weight:700;font-size:14px;transition:.12s;width:100%}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--mint);color:#fff}
.btn.coin{background:var(--coin);color:#3b2a06}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn-row{display:flex;gap:8px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 12px;
  text-align:left;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:7px;min-height:86px}
.tile .em{font-size:25px}
.tile .tt{font-weight:700;font-size:13.5px}
.tile .ds{font-size:11px;color:var(--muted);margin-top:-4px}

.tx{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:none}
.tx .ti{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.tx .tl{font-weight:600;font-size:13.5px}
.tx .td{font-size:11px;color:var(--faint)}
.tx .tv{margin-left:auto;font-weight:800;font-size:14px}
.plus{color:var(--good)} .minus{color:var(--danger)}
.ic-give{background:var(--mint-soft)} .ic-quest{background:var(--coin-soft)}
.ic-spend{background:var(--spend-soft)} .ic-fine{background:var(--danger-soft)}
.ic-tr{background:var(--spend-soft)}

.quest{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1px solid var(--line);
  border-radius:var(--r-sm);margin-bottom:10px;background:var(--surface);box-shadow:var(--shadow-sm)}
.quest .qe{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:21px;flex-shrink:0}
.q-study{background:var(--mint-soft)} .q-help{background:var(--spend-soft)} .q-health{background:var(--coin-soft)}
.quest .qt{font-weight:700;font-size:14.5px}
.quest .qd{font-size:11.5px;color:var(--muted);margin:1px 0 8px}
.quest .qr{font-weight:800;color:var(--coin-ink);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:20px;margin-bottom:6px}
.b-open{background:var(--mint-soft);color:var(--mint-ink)}
.b-prog{background:var(--spend-soft);color:var(--spend)}
.b-wait{background:var(--coin-soft);color:var(--coin-ink)}
.b-done{background:var(--surface-2);color:var(--muted)}
.b-review{background:var(--danger-soft);color:var(--danger)}
.countdown{font-size:11px;font-weight:700;color:var(--danger);margin-top:6px}

.req{border-left:3px solid var(--line);padding:12px 13px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);margin-bottom:10px;box-shadow:var(--shadow-sm)}
.req.spend{border-left-color:var(--spend)} .req.transfer{border-left-color:var(--spend)}
.req.completion{border-left-color:var(--coin)} .req.proposal{border-left-color:var(--mint)}
.req.fine{border-left-color:var(--danger)}
.req .rk{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.req .rt{font-weight:700;font-size:14.5px}
.req .rd{font-size:12px;color:var(--muted);margin:2px 0 10px}
.req .amt-big{font-family:var(--disp);font-size:20px}
.fine-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:4px 0 12px}
.fine-reason{font-family:var(--disp);font-size:21px;line-height:1.25;flex:1;color:var(--ink)}
.fine-amt{font-family:var(--disp);font-size:21px;color:var(--danger);white-space:nowrap}

/* empty */
.empty{text-align:center;color:var(--faint);padding:38px 20px;font-size:13px}
.empty .e{font-size:40px;display:block;margin-bottom:8px;opacity:.5}

/* donut + analysis */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:108px;height:108px;border-radius:50%;flex-shrink:0;position:relative}
.donut::after{content:"";position:absolute;inset:23px;background:var(--surface);border-radius:50%}
.legend{flex:1;display:flex;flex-direction:column;gap:7px}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend .sw{width:11px;height:11px;border-radius:3px}
.legend .lv{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:11px}
.barrow .bt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.barrow .bt b{font-weight:700}
.track{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.track .fill{height:100%;border-radius:5px}
.valrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.valrow:last-child{border:none}
.valrow .star{color:var(--coin);letter-spacing:1px;font-size:12px}
.valrow .vv{margin-left:auto;font-weight:800}
.insight{background:var(--coin-soft);color:var(--coin-ink);border-radius:var(--r-sm);padding:12px 13px;
  font-size:12.5px;font-weight:600;line-height:1.5;display:flex;gap:9px}
.insight .q{font-size:17px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,27,.5);display:flex;align-items:flex-end;justify-content:center;
  z-index:50;padding:0;backdrop-filter:blur(2px)}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:18px 18px 24px;
  box-shadow:var(--shadow);max-height:88vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:19px;margin:2px 0 3px}
.sheet .msub{font-size:12.5px;color:var(--muted);margin-bottom:15px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:15px;background:var(--surface-2);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 13px;border-radius:12px;background:var(--surface-2);border:1.5px solid transparent;
  font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.chips button.on{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink)}
.emoji-chips button{font-size:21px;padding:7px 9px}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--surface-2);
  border-radius:12px;padding:9px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--surface);font-size:20px;font-weight:700;
  box-shadow:var(--shadow-sm)}
.stepper .val{font-family:var(--disp);font-size:24px;min-width:92px;text-align:center}
.stars{display:flex;gap:8px;justify-content:center}
.stars button{font-size:30px;opacity:.3;transition:.1s}
.stars button.on{opacity:1}
.calc{background:var(--mint-soft);color:var(--mint-ink);border-radius:12px;padding:11px 13px;font-weight:700;
  font-size:14px;text-align:center;margin-top:4px}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  pointer-events:none}
.celebrate .msg{background:var(--surface);border-radius:22px;padding:26px 30px;text-align:center;
  box-shadow:var(--shadow);animation:pop .4s cubic-bezier(.18,1.3,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.celebrate .big{font-family:var(--disp);font-size:38px;color:var(--coin-ink);margin:6px 0 2px}
.celebrate .em{font-size:50px}
.coin{position:fixed;top:-30px;font-size:26px;z-index:59;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(540deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){
  .sheet,.celebrate .msg{animation:none}.coin{display:none}
}
.foot{text-align:center;font-size:11px;color:var(--faint);margin-top:14px;line-height:1.6}
</style>

<div class="wrap">
  <div class="demobar" id="demobar">
    <div id="demoControls" style="display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;min-width:0"></div>
    <button class="themebtn" id="theme" title="테마 전환">🌙</button>
  </div>
  <div class="phone"><div class="screen">
    <div class="hd" id="hd"></div>
    <div class="body" id="view"></div>
    <div class="nav" id="nav"></div>
  </div></div>
  <div class="foot">프로토타입 · 입력한 내용은 이 브라우저에만 저장됩니다<br>상단에서 계정을 바꿔 부모·아이 화면을 모두 체험해 보세요</div>
</div>

let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function nid(){return ++S.seq}

let role='parent', tab={parent:'home',big:'home',small:'home'}, focusKid='big', actor='엄마';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const won=n=>n.toLocaleString('ko-KR');
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
function catInfo(c){return CATS[c]||{e:'💸',n:c}}
function txIcon(t){
  if(t.group==='income')return t.cat==='quest'?['🏆','ic-quest']:['🎁','ic-give'];
  if(t.group==='fine')return['⚠️','ic-fine'];
  if(t.group==='transfer')return['💌','ic-tr'];
  return [catInfo(t.cat).e,'ic-spend'];
}
function kidTx(k){return S.tx.filter(t=>t.kid===k)}
function pendFor(kind,pred){return S.pending.filter(p=>p.kind===kind&&(!pred||pred(p)))}
function parentQueueCount(){
  return S.pending.filter(p=>p.kind!=='fine').length + S.quests.filter(q=>q.status==='done_sub').length;
}
function childAlertCount(k){return S.pending.filter(p=>p.kind==='fine'&&p.kid===k).length}
function stars(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n)}

/* ---------- quest card (shared) ---------- */
function questCard(q,childSide){
  const qc=QCAT[q.cat];
  const rw=q.type==='unit'?`${q.unit}당 ${won(q.reward)}원`:`${won(q.reward)}원`;
  let badge='',action='';
  if(q.status==='open'){badge='<span class="badge b-open">🟢 모집중</span>';
    if(childSide)action=`<button class="btn pri sm" style="width:100%;margin-top:8px" data-apply="${q.id}">할래요!</button>`;}
  else if(q.status==='prog'){badge='<span class="badge b-prog">🔵 진행중</span>';
    if(childSide)action=`<div class="countdown">⏰ 오늘 밤 12시까지 끝내기!</div>
      <button class="btn coin sm" style="width:100%;margin-top:8px" data-submit="${q.id}">다 했어요 ✓</button>`;}
  else if(q.status==='done_sub'){badge='<span class="badge b-wait">⏳ 확인 대기중</span>';}
  else if(q.status==='done'){badge='<span class="badge b-done">✅ 완료</span>';}
  return `<div class="quest"><div class="qe ${qc.c}">${qc.e}</div>
    <div style="flex:1">${badge}${q.by==='child'?'<span class="badge b-open" style="background:var(--coin-soft);color:var(--coin-ink)">✋ 내 제안</span>':''}
    <div class="qt">${q.title}</div><div class="qd">${qc.n}${q.repeat==='반복'?' · 반복':''}${q.actor?' · '+q.actor+' 등록':''}</div>
    <div class="qr">🏆 ${rw}</div>${action}</div></div>`;
}
function cQuests(v,k){
  let h=`<div style="display:flex;gap:8px;align-items:center;margin:6px 0 12px">
    <div style="font-family:var(--disp);font-size:17px;flex:1">도전할 퀘스트</div>
    <button class="btn coin sm" data-act="propose">✋ 제안하기</button></div>`;
  const qs=S.quests.filter(q=>q.kid===k);
  const order={prog:0,open:1,done_sub:2,done:3};
  qs.sort((a,b)=>order[a.status]-order[b.status]);

  qs.forEach(q=>h+=questCard(q,true));
  v.innerHTML=h;
}

/* ---------- stats (shared) ---------- */
function stats(v,k,parentSide){
  const kd=KID(k);
  const tx=kidTx(k);
  const incomeCats={weekly:['주간 용돈','var(--mint)'],quest:['퀘스트','var(--coin)'],
    transfer:['받은 돈','var(--spend)'],manual:['직접 받음','var(--mint-ink)']};
  const inc={}; tx.filter(t=>t.sign>0).forEach(t=>{const key=t.cat in incomeCats?t.cat:'manual';inc[key]=(inc[key]||0)+t.amt});
  const incData=Object.entries(inc).map(([c,val])=>({label:incomeCats[c][0],color:incomeCats[c][1],value:val}));

  const spendCats={};
  tx.filter(t=>t.sign<0&&t.group!=='fine').forEach(t=>{spendCats[t.cat]=(spendCats[t.cat]||0)+t.amt});
  const spColors={food:'#E58F2F',toy:'#E5573F',study_buy:'#0FA98C',book:'#4C82F7',gift:'#C65CC6',donate:'#2FA86A',game:'#7A5CF0',tv:'#F5B133'};
  const spData=Object.entries(spendCats).map(([c,val])=>({label:catInfo(c).n,emoji:catInfo(c).e,color:spColors[c]||'#888',value:val}));

  let h=`<div class="sec-t">${parentSide?kd.emoji+' '+kd.name+' · ':''}💰 어디서 들어왔나</div>`;
  h+=`<div class="card">${donut(incData)}</div>`;
  h+=`<div class="sec-t">🛍 어디에 썼나</div>`;
  h+= spData.length?`<div class="card">${bars(spData)}</div>`:`<div class="empty" style="padding:20px">아직 쓴 내역이 없어요</div>`;

  // quest earnings / 효용 비교
  const qe={};
  tx.filter(t=>t.sign>0&&t.cat==='quest').forEach(t=>{
    const key=t.label.replace(/\s*\(.*\)/,'');
    if(!qe[key])qe[key]={total:0,cnt:0,diffs:[]};
    qe[key].total+=t.amt; qe[key].cnt++; if(t.diff)qe[key].diffs.push(t.diff);
  });
  const qeArr=Object.entries(qe);
  h+=`<div class="sec-t">🏆 퀘스트로 번 돈 · 힘든 정도</div><div class="card">`;
  if(qeArr.length){
    qeArr.sort((a,b)=>b[1].total-a[1].total);
    qeArr.forEach(([name,d])=>{
      const avg=d.diffs.length?Math.round(d.diffs.reduce((a,b)=>a+b,0)/d.diffs.length):0;
      h+=`<div class="valrow"><span>${name}</span>
        ${avg?`<span class="star">${stars(avg)}</span>`:''}
        <span class="vv tnum">${won(d.total)}원</span></div>`;
    });
    // insight: find same-reward different-difficulty pair
    h+=`</div><div class="insight"><span class="q">💡</span><span>${utilityInsight(qeArr)}</span></div>`;
  }else{ h+=`<div class="empty" style="padding:10px">아직 퀘스트로 번 돈이 없어요</div></div>`; }
  v.innerHTML=h;
}
function utilityInsight(arr){
  // compare per-unit reward vs difficulty
  let hard=null,easy=null;
  arr.forEach(([n,d])=>{
    if(!d.diffs.length)return; const diff=d.diffs.reduce((a,b)=>a+b,0)/d.diffs.length;
    const per=d.total/d.cnt;
    if(!hard||diff>hard.diff)hard={n,diff,per};
    if(!easy||diff<easy.diff)easy={n,diff,per};
  });
  if(hard&&easy&&hard.n!==easy.n)
    return `"${hard.n}"은 "${easy.n}"보다 힘든데, 비슷한 돈을 벌었네! 어떤 일이 더 이득일지 생각해 볼까?`;
  return '퀘스트를 여러 개 해보면, 힘든 정도에 따라 어떤 일이 더 이득인지 비교할 수 있어요!';
}
function donut(data){
  const tot=data.reduce((a,d)=>a+d.value,0)||1;
  let acc=0; const segs=data.map(d=>{const s=acc/tot*360;acc+=d.value;const e=acc/tot*360;
    return `${d.color} ${s}deg ${e}deg`;}).join(',');
  const legend=data.map(d=>`<div class="lg"><span class="sw" style="background:${d.color}"></span>
    ${d.label}<span class="lv tnum">${Math.round(d.value/tot*100)}%</span></div>`).join('');
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${segs})"></div>
    <div class="legend">${legend}</div></div>`;
}
function bars(data){
  const max=Math.max(...data.map(d=>d.value))||1;
  return '<div class="bars">'+data.sort((a,b)=>b.value-a.value).map(d=>`<div class="barrow">
    <div class="bt"><span>${d.emoji||''} ${d.label}</span><b class="tnum">${won(d.value)}원</b></div>
    <div class="track"><div class="fill" style="width:${Math.max(8,d.value/max*100)}%;background:${d.color}"></div></div>
    </div>`).join('')+'</div>';
}

/* ---------- modal ---------- */
function modal(html){
  closeModal();
  const s=el(`<div class="scrim"><div class="sheet">${html}</div></div>`);
  s.addEventListener('click',e=>{if(e.target===s)closeModal()});
  document.body.appendChild(s);
  return s;
}
function closeModal(){const s=$('.scrim');if(s)s.remove()}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-role],[data-actor],[data-tab],[data-act],[data-goto],[data-focus],[data-editkid],[data-buy],[data-time],[data-apply],[data-submit],[data-approve],[data-reject],[data-confirm],[data-ack]');
  if(!t)return;
  const d=t.dataset;
  if(d.role){role=d.role;render();return;}
  if(d.actor){actor=d.actor;render();return;}
  if(d.tab){tab[role]=d.tab;render();return;}
  if(d.goto){tab[role]=d.goto;render();return;}
  if(d.focus){focusKid=d.focus;tab.parent='stats';render();return;}
  if(d.editkid)return kidFormSheet(d.editkid);
  if(d.act)return doAct(d.act);
  if(d.buy)return buyFlow(d.buy);
  if(d.time)return timeFlow(d.time);
  if(d.apply)return applyQuest(+d.apply);
  if(d.submit)return submitFlow(+d.submit);
  if(d.approve)return approve(+d.approve);
  if(d.reject)return reject(+d.reject);
  if(d.confirm)return confirmFlow(+d.confirm);
  if(d.ack)return ackFine(+d.ack);
});

function doAct(a){
  if(a==='alerts')return alertsSheet();
  if(a==='addkid')return kidFormSheet(null);
  if(a==='give')return giveSheet();
  if(a==='fine')return fineSheet();
  if(a==='send')return sendSheet();
  if(a==='newquest')return questSheet(false);
  if(a==='propose')return questSheet(true);
}

/* child: buy (convert) */
function buyFlow(cat){
  const ci=CATS[cat];
  modal(`<h3>${ci.e} ${ci.n} 사기</h3><div class="msub">얼마가 필요한지 적고, 부모님께 보내요</div>
    <div class="field"><label>필요한 금액 (원)</label><input id="amt" type="number" inputmode="numeric" placeholder="예: 2000"></div>
    <div class="field"><label>무엇을 살 거예요?</label><input id="memo" placeholder="예: 친구 생일 선물"></div>
    <button class="btn pri" id="go">부모님께 요청 💌</button>`);
  $('#go').onclick=()=>{const amt=+$('#amt').value; if(!amt)return $('#amt').focus();
    S.pending.push({id:nid(),kind:'spend',kid:role,cat,amt,memo:$('#memo').value||ci.n+' 구매',convert:true});
    save();closeModal();toast('요청을 보냈어요! 부모님 확인을 기다려요 ⏳');render();};
}
/* child: time pass */
function timeFlow(kind){
  const kd=KID(role); let hours=1;
  const label=kind==='game'?'🎮 게임 이용권':'📺 TV 이용권';
  const m=modal(`<h3>${label}</h3><div class="msub">시간당 ${won(kd.rate)}원 · 쓸 만큼 골라요</div>
    <div class="stepper"><button id="mi">−</button><div class="val" id="hv">1시간</div><button id="pl">＋</button></div>
    <div class="calc" id="calc">${won(kd.rate)}원 차감</div>
    <button class="btn pri" id="go" style="margin-top:14px">부모님께 요청 💌</button>`);
  const upd=()=>{$('#hv').textContent=(hours%1?hours.toFixed(1):hours)+'시간';
    $('#calc').textContent=won(Math.round(kd.rate*hours))+'원 차감';};
  $('#mi').onclick=()=>{hours=Math.max(.5,hours-.5);upd()};
  $('#pl').onclick=()=>{hours=Math.min(5,hours+.5);upd()};
  $('#go').onclick=()=>{const amt=Math.round(kd.rate*hours);
    S.pending.push({id:nid(),kind:'spend',kid:role,cat:kind,amt,memo:(hours%1?hours.toFixed(1):hours)+'시간 이용',convert:false});
    save();closeModal();toast('요청을 보냈어요! 부모님 확인을 기다려요 ⏳');render();};
}
/* child: send to sibling */
function sendSheet(){
  const others=kidsOrder().filter(id=>id!==role);
  if(!others.length)return toast('보낼 형제가 없어요');
  const toSel=others.length===1
    ? `<input type="hidden" id="to" value="${others[0]}">`
    : `<div class="field"><label>누구에게?</label><select id="to">
        ${others.map(id=>`<option value="${id}">${KID(id).emoji} ${KID(id).name}</option>`).join('')}</select></div>`;
  modal(`<h3>💌 형제에게 보내기</h3>
    <div class="msub">부모님이 확인하면 전달돼요 · 서로의 잔액은 볼 수 없어요</div>
    ${toSel}
    <div class="field"><label>보낼 금액 (원)</label><input id="amt" type="number" inputmode="numeric" placeholder="예: 500"></div>
    <div class="field"><label>한마디</label><input id="memo" placeholder="예: 생일 축하해!"></div>
    <button class="btn coin" id="go">보내기 요청</button>`);
  $('#go').onclick=()=>{const amt=+$('#amt').value;if(!amt)return $('#amt').focus();
    if(amt>S.bal[role])return toast('잔액보다 많이 보낼 수 없어요');
    S.pending.push({id:nid(),kind:'transfer',kid:role,to:$('#to').value,amt,memo:$('#memo').value||'용돈 선물'});
    save();closeModal();toast('보내기 요청 완료! 부모님 확인을 기다려요 💌');render();};
}
/* child: propose quest */
/* child: apply/submit */
function applyQuest(id){const q=S.quests.find(x=>x.id===id);q.status='prog';
  q.deadline=new Date().toISOString().slice(0,10);save();toast('도전 시작! 오늘 밤 12시까지 끝내기 ⏰');render();}
function submitFlow(id){
  const q=S.quests.find(x=>x.id===id); let qty=1,diff=2;
  const unitField=q.type==='unit'?`<div class="field"><label>몇 ${q.unit} 했어요?</label>
    <div class="stepper"><button id="mi">−</button><div class="val" id="qv">1${q.unit}</div><button id="pl">＋</button></div>
    <div class="calc" id="calc">${won(q.reward)}원 받을 예정</div></div>`:'';
  modal(`<h3>${q.title} 완료! 🎉</h3><div class="msub">얼마나 했는지, 얼마나 힘들었는지 알려줘요</div>
    ${unitField}
    <div class="field"><label>얼마나 힘들었어요?</label>
      <div class="stars" id="stars">${[1,2,3].map(n=>`<button data-s="${n}" class="${n<=diff?'on':''}">⭐</button>`).join('')}</div></div>
    <button class="btn coin" id="go">완료 제출하기 ✓</button>`);
  const calc=()=>{if(q.type==='unit'){$('#qv').textContent=qty+q.unit;$('#calc').textContent=won(q.reward*qty)+'원 받을 예정';}};
  if(q.type==='unit'){$('#mi').onclick=()=>{qty=Math.max(1,qty-1);calc()};$('#pl').onclick=()=>{qty++;calc()};}
  $('#stars').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;diff=+b.dataset.s;
    $('#stars').querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i<diff));};
  $('#go').onclick=()=>{q.status='done_sub';q.sub={qty,diff};save();closeModal();
    toast('완료 제출 완료! 부모님 확인을 기다려요 ⏳');render();};
}
/* quest create / propose */
function questSheet(isProposal){
  const kidSel=isProposal?'':`<div class="field"><label>누구의 퀘스트?</label>
    <select id="kid">${kidsOrder().map(id=>`<option value="${id}">${KID(id).emoji} ${KID(id).name}</option>`).join('')}</select></div>`;
  modal(`<h3>${isProposal?'✋ 퀘스트 제안하기':'＋ 새 퀘스트'}</h3>
    <div class="msub">${isProposal?'하고 싶은 일을 부모님께 제안해요':'아이가 도전할 일을 만들어요'}</div>
    ${kidSel}
    <div class="field"><label>무슨 일?</label><input id="title" placeholder="예: 방 청소하기"></div>
    <div class="field"><label>종류</label><div class="chips" id="cat">
      ${Object.entries(QCAT).map(([k,c],i)=>`<button data-c="${k}" class="${i===0?'on':''}">${c.e} ${c.n}</button>`).join('')}</div></div>
    <div class="field"><label>${isProposal?'원하는 보상 (원)':'보상 (원)'}</label><input id="reward" type="number" inputmode="numeric" placeholder="예: 500"></div>
    <button class="btn pri" id="go">${isProposal?'부모님께 제안':'퀘스트 등록'}</button>`);
  let cat='study';
  $('#cat').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;
    $('#cat').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
  $('#go').onclick=()=>{const title=$('#title').value.trim(),reward=+$('#reward').value;
    if(!title)return $('#title').focus(); if(!reward)return $('#reward').focus();
    if(isProposal){S.pending.push({id:nid(),kind:'proposal',kid:role,title,cat,reward});
      toast('제안을 보냈어요! 부모님 승인을 기다려요 ✋');}
    else{S.quests.push({id:nid(),kid:$('#kid').value,title,cat,type:'fixed',reward,status:'open',by:'parent',actor});
      toast(actor+'가 퀘스트를 등록했어요 🏆');}
    save();closeModal();render();};
}
/* parent: add / edit child */
function kidFormSheet(id){
  const isNew=!id;
  const kd=isNew?{name:'',emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],rate:500}:KID(id);
  let emoji=kd.emoji;
  const canRemove=!isNew&&kidsOrder().length>1;
  modal(`<h3>${isNew?'＋ 아이 추가':'아이 정보 수정'}</h3>
    <div class="msub">이름(별명)·아이콘·타임충전권 요율을 정해요</div>
    <div class="field"><label>이름 / 별명</label><input id="name" value="${kd.name}" placeholder="예: 하준, 첫째, 우리딸"></div>
    <div class="field"><label>아이콘</label><div class="chips emoji-chips" id="emo">
      ${EMOJIS.map(e=>`<button data-e="${e}" class="${e===emoji?'on':''}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>타임충전권 시간당 요율 (원)</label>
      <input id="rate" type="number" inputmode="numeric" value="${kd.rate}" placeholder="예: 1000"></div>
    <button class="btn pri" id="go">${isNew?'추가하기':'저장하기'}</button>
    ${canRemove?`<button class="btn line" id="rm" style="margin-top:8px;color:var(--danger)">이 아이 삭제</button>`:''}`);
  $('#emo').onclick=e=>{const b=e.target.closest('[data-e]');if(!b)return;emoji=b.dataset.e;
    $('#emo').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
  $('#go').onclick=()=>{const name=$('#name').value.trim()||'아이';const rate=+$('#rate').value||0;
    if(isNew){const k='k'+nid();S.kids[k]={name,emoji,rate};S.order.push(k);S.bal[k]=0;toast(name+' 추가 완료 🎉');}
    else{S.kids[id]={name,emoji,rate};toast('저장했어요');}
    save();closeModal();render();};
  if(canRemove)$('#rm').onclick=()=>{
    delete S.kids[id];S.order=S.order.filter(x=>x!==id);delete S.bal[id];
    S.quests=S.quests.filter(q=>q.kid!==id);
    S.pending=S.pending.filter(p=>p.kid!==id&&p.to!==id);
    S.tx=S.tx.filter(t=>t.kid!==id);
    if(focusKid===id)focusKid=kidsOrder()[0]; if(role===id)role='parent';
    save();closeModal();toast('삭제했어요');render();};
}
/* parent: give */
function giveSheet(){
  modal(`<h3>🎁 용돈 주기</h3><div class="msub">아이에게 용돈을 지급해요</div>
    <div class="field"><label>누구에게?</label><select id="kid">
      ${kidsOrder().map(id=>`<option value="${id}">${KID(id).emoji} ${KID(id).name} (${won(S.bal[id])}원)</option>`).join('')}</select></div>
    <div class="field"><label>금액 (원)</label><input id="amt" type="number" inputmode="numeric" placeholder="예: 3000"></div>
    <div class="field"><label>메모</label><input id="memo" placeholder="예: 이번 주 용돈"></div>
    <button class="btn pri" id="go">용돈 주기</button>`);
  $('#go').onclick=()=>{const kid=$('#kid').value,amt=+$('#amt').value;if(!amt)return $('#amt').focus();
    S.bal[kid]+=amt; S.tx.push({id:nid(),kid,sign:1,amt,group:'income',cat:'manual',label:$('#memo').value||'용돈',date:'오늘',by:actor});
    save();closeModal();toast(actor+'가 용돈을 지급했어요 🎁');render();};
}
/* parent: fine propose */
function fineSheet(){
  modal(`<h3>⚠️ 벌금 부과</h3><div class="msub">아이가 "확인"하면 차감돼요 · 돈이 빠져나간다는 걸 알게 해줘요</div>
    <div class="field"><label>누구에게?</label><select id="kid">
      ${kidsOrder().map(id=>`<option value="${id}">${KID(id).emoji} ${KID(id).name}</option>`).join('')}</select></div>
    <div class="field"><label>금액 (원)</label><input id="amt" type="number" inputmode="numeric" placeholder="예: 200"></div>
    <div class="field"><label>이유</label><input id="reason" placeholder="예: 약속을 어겼어요"></div>
    <button class="btn danger" id="go">벌금 부과하기</button>`);
  $('#go').onclick=()=>{const kid=$('#kid').value,amt=+$('#amt').value;if(!amt)return $('#amt').focus();
    S.pending.push({id:nid(),kind:'fine',kid,amt,reason:$('#reason').value||'약속 어김',by:actor});
    save();closeModal();toast(actor+'가 벌금을 부과했어요 · 아이에게 안내를 보냈어요');render();};
}
/* child alerts (fines to agree) */
function alertsSheet(){
  const fines=S.pending.filter(p=>p.kind==='fine'&&p.kid===role);
  let h=`<h3>🔔 알림</h3><div class="msub">확인이 필요한 일이에요</div>`;
  if(!fines.length)h+=`<div class="empty" style="padding:20px">새 알림이 없어요 🌿</div>`;
  fines.forEach(p=>{h+=`<div class="req fine"><div class="rk" style="color:var(--danger)">${p.by||'부모'}가 부과한 벌금</div>
    <div class="fine-row"><div class="fine-reason">${p.reason}</div><div class="fine-amt">-${won(p.amt)}원</div></div>
    <button class="btn danger sm" style="width:100%" data-ack="${p.id}">확인했어요</button></div>`;});
  modal(h);
}
function ackFine(id){const i=S.pending.findIndex(p=>p.id===id);const p=S.pending[i];
  S.bal[p.kid]-=p.amt; S.tx.push({id:nid(),kid:p.kid,sign:-1,amt:p.amt,group:'fine',cat:'fine',label:'벌금 · '+p.reason,date:'오늘',by:p.by});
  S.pending.splice(i,1);save();closeModal();toast('벌금 '+won(p.amt)+'원이 빠져나갔어요');render();}

/* parent approvals */
function approve(id){
  const i=S.pending.findIndex(p=>p.id===id);const p=S.pending[i];
  if(p.kind==='spend'){S.bal[p.kid]-=p.amt;
    S.tx.push({id:nid(),kid:p.kid,sign:-1,amt:p.amt,group:'spend',cat:p.cat,label:p.memo,date:'오늘',by:actor+' 승인'});
    toast(actor+'가 승인했어요 · 아이 지갑에서 차감됐어요');}
  else if(p.kind==='transfer'){S.bal[p.kid]-=p.amt;S.bal[p.to]+=p.amt;
    S.tx.push({id:nid(),kid:p.kid,sign:-1,amt:p.amt,group:'transfer',cat:'transfer',label:KID(p.to).name+'에게 보냄',date:'오늘',by:actor+' 승인'});
    S.tx.push({id:nid(),kid:p.to,sign:1,amt:p.amt,group:'transfer',cat:'transfer',label:KID(p.kid).name+'에게 받음',date:'오늘',by:actor+' 승인'});
    toast(actor+'가 송금을 승인했어요 💌');}
  else if(p.kind==='proposal'){S.quests.push({id:nid(),kid:p.kid,title:p.title,cat:p.cat,type:'fixed',reward:p.reward,status:'open',by:'child'});
    toast('제안을 승인해 퀘스트로 등록했어요 🏆');}
  S.pending.splice(i,1);save();render();
}
function reject(id){const i=S.pending.findIndex(p=>p.id===id);S.pending.splice(i,1);save();toast('거절했어요');render();}
function confirmFlow(id){
  const q=S.quests.find(x=>x.id===id);
  const base=q.type==='unit'?q.reward*q.sub.qty:q.reward; let bonus=0;
  modal(`<h3>${q.title} 확인 ✓</h3><div class="msub">잘했으면 보너스를 더 줄 수 있어요</div>
    <div class="calc">기본 보상 ${won(base)}원 · 난이도 ${stars(q.sub.diff)}</div>
    <div class="field" style="margin-top:14px"><label>보너스 (선택)</label>
      <div class="chips" id="bonus">
        <button data-b="0" class="on">없음</button><button data-b="300">+300</button>
        <button data-b="500">+500</button><button data-b="1000">+1000</button></div></div>
    <div class="calc" id="tot" style="background:var(--coin-soft);color:var(--coin-ink)">총 ${won(base)}원 지급</div>
    <button class="btn coin" id="go" style="margin-top:14px">🎉 보상 지급하기</button>`);
  $('#bonus').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;bonus=+b.dataset.b;
    $('#bonus').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    $('#tot').textContent='총 '+won(base+bonus)+'원 지급';};
  $('#go').onclick=()=>{const total=base+bonus;S.bal[q.kid]+=total;
    const lab=q.title+(q.type==='unit'?` (${q.sub.qty}${q.unit})`:'')+(bonus?' +보너스':'');
    S.tx.push({id:nid(),kid:q.kid,sign:1,amt:total,group:'income',cat:'quest',label:lab,date:'오늘',diff:q.sub.diff,by:actor});
    q.status='done';save();closeModal();celebrate(total);render();};
}

/* ---------- feedback ---------- */
function toast(msg){
  const old=$('.toast');if(old)old.remove();
  const t=el(`<div class="toast" style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;
    z-index:70;box-shadow:var(--shadow);max-width:90%;text-align:center">${msg}</div>`);
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);
}
function celebrate(amt){
  const c=el(`<div class="celebrate"><div class="msg"><div class="em">🎉</div>
    <div class="big">+${won(amt)}원!</div><div style="color:var(--muted);font-size:13px">보상이 지급됐어요</div></div></div>`);
  document.body.appendChild(c);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
    const emo=['🪙','⭐','💰','🎊'];
    for(let i=0;i<18;i++){const coin=el(`<div class="coin">${emo[i%4]}</div>`);
      coin.style.left=Math.random()*100+'vw';coin.style.animationDuration=(1+Math.random()*1.2)+'s';
      coin.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(coin);
      setTimeout(()=>coin.remove(),2600);}
  }
  setTimeout(()=>c.remove(),1800);
}

/* ---------- theme ---------- */
$('#theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  $('#theme').textContent=dark?'🌙':'☀️';
};

render();
</script>
